---
apiVersion: v1
kind: Namespace
metadata:
  name: psait-ns

---
apiVersion: v1
kind: Pod
metadata:
  name: testpod
  namespace: psait-ns
  labels:
    app: javaapp

spec:
  containers:
    - name: webappcontainer
      image: karthikgubber45/docker_image123:latest
      ports:
        - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: test-service
  namespace: psait-ns

spec:
  type: NodePort
  selector:
    app: javaapp

  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
